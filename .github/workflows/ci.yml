# 回归套件（CPU-only、零 GPU）。
#
# 设计口径与 H 仓（ComfyUI-H3-Latent-Relay）一致：
#   · **每个脚本用自己的退出码表达成败**，不靠解析输出 ⇒ 失败即非零，CI 直接红；
#   · 期望值写在这里，但**不写行号**（会漂的东西别写）；
#   · 只跑"能确定判定"的东西：几何、契约、词表、装载。**成片质量不进 CI**（要 GPU + 权重）。
#
# 期望值（改动后若数字变了，请同步 CONTRIBUTING.md 与本文件）：
#   · 302/0  tests/test_core.py               几何 / 提示词 / 像素
#   · 137/0  tests/test_editor.py             state v3 编译层 / 预设 / 错误路径 / 上限 / 外接稿
#   ·  88/0  tests/test_interop.py            elements-v1 ⇄ state v3 映射 / 往返 / CLI
#   ·  22/0  tests/test_extract.py            从散文/代码块提取 JSON、上限/扫描预算
#   ·  57/0  tests/test_adversarial.py        恶意/极端输入：JSON 常量 / 原型链 / 量化 / 扫描预算
#   ·  27/0  tests/test_planner.py            brief → elements 模板 / 错误路径 / CLI
#   ·  79/0  tests/test_skill_draft.py        官方 prompt-enhancer 草稿 / 编译 / state / CLI
#   · 132/0  tests/test_contract.py --no-host 参数表 / 错误路径 / 依赖边界 / 仓库卫生 / 词表完整性 / 调度器同源
#   ·  19/0  tests/test_sampling_contract.py  宿主采样 API 的入参类型（桩替身）
#   ·  54/0  tests/test_i18n.mjs              中英切换纯函数（node）
#   ·  58/0  tools/smoke_nodes.py             自加载 + 纯节点真跑
#   ·  19/0  tools/host_loader_check.py       走宿主 load_custom_node
#   ·  15/0 每个文件  tools/check_ui_workflow.py   工作流连线 + widget 槽位逐位值域
#                各文件：10 编辑器海报 · 14 编辑器故事板 · 15 4 格 UI / 8 格 / 0.1.x 20 槽 · 19 4 格编辑
#                （CI 传 4 个示例 + 2 个夹具 ⇒ 实际 88 项）
#   ·   9/0  tools/check_frontend.py          前端词表纯净度 / 语法 / 接线 / 工作流标题可换语言
#   · 133/0  tools/check_editor_ui.py         编辑器接线 / 语法 / 词表 / 互操作 / 层级对齐
#   ·  90/0  tests/test_cross_language.py     JS ↔ Python 预设/校验/elements/canvas/外接稿 差分
#   ·   9/0  tests/test_panel_assembly.py      逐格拼版 reborder 语义 / 逐格 latent batch
#   · release-preview: check_release_ready + 干净分发包构建（不发布，上传 zip artifact）
#
# ⚠️ **已知覆盖缺口（诚实记录，别当成已覆盖）**：
#   1. `host` job 需要在 runner 上现装 ComfyUI，**本机（Windows）无法等价复现**
#      ⇒ 先设为 `continue-on-error`，本地等价闸是 `tools/host_loader_check.py`。
#      等它在 main 上连续绿过几次再取消这个开关。
#   2. 只跑 CPU：`bf16` / 显存路径 / VAE 解码全部不在 CI 内。
#   3. `tools/e2e_matrix.py` 不进 CI（要 GPU + 4GB 权重），靠人工在真机跑。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --disable-pip-version-check ruff
      - run: ruff check .

  unit:
    name: unit py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # CPU 轮子：本包的像素/采样测试只用 torch 的张量算子，不需要 CUDA
      - run: pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: 几何 / 提示词 / 像素
        run: python tests/test_core.py
      - name: 编辑器 state v3 编译层
        run: python tests/test_editor.py
      - name: elements-v1 互操作
        run: python tests/test_interop.py
      - name: JSON 提取
        run: python tests/test_extract.py
      - name: 恶意 / 极端输入
        run: python tests/test_adversarial.py
      - name: brief 模板
        run: python tests/test_planner.py
      - name: 官方提示词草稿编译
        run: python tests/test_skill_draft.py
      - name: 逐格拼版宫格线语义
        run: python tests/test_panel_assembly.py
      - name: 契约（不碰宿主）
        run: python tests/test_contract.py --no-host
      - name: 采样 API 契约
        run: python tests/test_sampling_contract.py
      - name: 跨语言词表一致性
        run: python tests/test_cross_language.py
      # 前端一致性放在这个 job：它需要 torch（要 import nodes.py 取参数名），
      # 而 runner 自带 node 供 F2 语法检查；万一没有 node，F2 会明确跳过并写进输出。
      - name: 前端一致性（词表 / 语法 / 接线 / 标题可换语言）
        run: python tools/check_frontend.py

  frontend:
    name: i18n (node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tests/test_i18n.mjs
      - name: 编辑器前端（接线 / 语法 / 词表纯函数）
        run: python tools/check_editor_ui.py

  release-preview:
    name: release preview (build only, no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # check_release_ready 的提交信息检查要最近 50 条
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release hygiene gate
        run: python tools/check_release_ready.py
      - name: Build clean distribution set (no publish)
        run: python tools/make_dist.py --out "$RUNNER_TEMP/moss-dist" --zip
      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: moss-storyboard-preview
          path: ${{ runner.temp }}/moss-dist/*.zip
          retention-days: 7

  host:
    name: host load (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 见文件头「已知覆盖缺口 1」：不阻塞整体结论。逐步骤的例外见下。
    env:
      COMFYUI_PATH: ${{ github.workspace }}/comfyui
      MOSSSB_PATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 取宿主（钉版本，避免上游漂移造成与本包无关的红）
        run: git clone --depth 1 --branch v0.42.0 https://github.com/comfyanonymous/ComfyUI.git comfyui
      - run: pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install --disable-pip-version-check -r comfyui/requirements.txt
      - name: 挂进 custom_nodes（真实加载路径）
        run: ln -s "$GITHUB_WORKSPACE" "$COMFYUI_PATH/custom_nodes/ComfyUI-MOSS-Storyboard"
      - name: 自加载 + 纯节点真跑
        run: python tools/smoke_nodes.py
      - name: Distribution preview (clean copy + independent load)
        env:
          COMFYUI_PATH: ${{ github.workspace }}/comfyui
          PYTHONPATH: ${{ github.workspace }}/comfyui
        run: python tools/make_dist.py --out "$RUNNER_TEMP/moss-dist-host" --verify
      # 🔴 CPU runner 上 ComfyUI 在 import 期就会断言 CUDA（`Torch not compiled with CUDA enabled`），
      #    这一步在 CI 里**必然失败**，且与本包无关。用 **step 级** continue-on-error：
      #    job 结论为绿，失败详情仍完整留在这一步的日志里。
      #    本地等价检查（有 GPU 的机器）见维护者本地发布文档 §2。
      - name: 走宿主 load_custom_node（CPU runner 上预期失败）
        continue-on-error: true
        run: python tools/host_loader_check.py
      # 同样要 import 宿主节点定义 ⇒ CPU runner 上可能同样触发 CUDA 断言。
      - name: 工作流连线与槽位（CPU runner 上可能跳过）
        continue-on-error: true
        run: |
          python tools/check_ui_workflow.py tests/fixtures/moss-storyboard-8panels-layout.json
          python tools/check_ui_workflow.py examples/moss-storyboard-4panels-ui.json
          python tools/check_ui_workflow.py examples/moss-storyboard-4panels-edit.json
          python tools/check_ui_workflow.py examples/moss-layout-editor-poster.json
          python tools/check_ui_workflow.py examples/moss-layout-editor-storyboard.json
          python tools/check_ui_workflow.py tests/fixtures/moss-storyboard-0.1-20slots.json
